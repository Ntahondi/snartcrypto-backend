services:
  smartcrypto-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcrypto-ai-v3
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - LOG_LEVEL=INFO
    volumes:
      # Persistent storage mounts (survives container rebuilds)
      - ./positions:/app/positions
      - ./signal_history:/app/signal_history
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3